name: Cross-platform Project Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-project-codec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test shared project fixture
        run: npm run test:project-contract
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Test project UI round-trip and malformed-file recovery
        env:
          AXRAL_CROSSLOAD_OUTPUT_DIR: ${{ github.workspace }}/cross-load-output
        run: npm run test:project-ui
      - name: Upload Web-generated project for cross-load verification
        uses: actions/upload-artifact@v4
        with:
          name: web-roundtrip-axral-json
          path: cross-load-output/web-roundtrip.axral.json
          if-no-files-found: error
          retention-days: 7
