name: Cross-platform Project Contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-project-codec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Test shared project fixture
        run: node scripts/test-stable-entity-ids.mjs
