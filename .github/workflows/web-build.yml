name: Web Frontend Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Test stable Entity ID compatibility
        run: node scripts/test-stable-entity-ids.mjs
      - name: Install Chromium for UI integration test
        run: npx playwright install --with-deps chromium
      - name: Test project UI round-trip
        run: npm run test:project-ui
      - name: Build browser app
        run: npm run build
